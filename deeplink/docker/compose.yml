name: ohos-gitcode

services:
  # Run server
  nginx:
    container_name: ohos-gitcode-nginx
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: always
    tty: true
    ports:
      - ${PORT_WEBSITE}:3000
    volumes:
      - ../website:/var/www/static
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf